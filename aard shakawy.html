 /*الشريط 2*/
 .main-header {
    background-color: #ffffc3;
    padding: 35px 0;
    box-shadow: 0px 2px 16px 7px rgb(168 16 16);
    border-bottom-left-radius: 50px;
    border-bottom-right-radius: 50px;
}

.nav-bar {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  padding: 0 20px;
}

.nav-links {
  display: flex;
  gap: 20px;
}

.nav-links a {
  color: #8b0000; /* أحمر دموي */
  text-decoration: none;
  font-weight: bold;
  font-size: 18px;
  position: relative;
  transition: color 0.3s ease;
}

.nav-links a::after {
  content: '';
  position: absolute;
  width: 0;
  height: 2px;
  background-color: #8b0000;
  bottom: -5px;
  left: 50%;
  transform: translateX(-50%);
  transition: width 0.3s ease;
}

.nav-links a:hover {
  color: #b22222;
}

.nav-links a:hover::after {
  width: 100%;
}

.logo img {
  height: 70px;
  width: auto;
  transition: transform 0.3s ease;
}

.logo img:hover {
  transform: scale(1.1);
}

/* موبايل */
@media (max-width: 768px) {
  .nav-bar {
    flex-direction: row;
    display: flex;
    align-items: center;
  }

  .nav-links {
    margin: 10px 0;
  }
}

/* منيو المواطن */
.dropdown {
  position: relative;
  display: inline-block;
}

.dropbtn {
  background-color: #f5f5dc; /* بيج */
  color: #8b0000;
  padding: 16px;
  font-size: 18px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  transition: color 0.3s ease;
  margin-top: -19px;

}

.dropbtn:hover {
  color: #b22222;
}

.dropbtn::after {
  content: " ▼"; /* السهم */
  font-size: 14px;
  margin-left: 5px;
  
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: #f5f5dc;
  min-width: 48px;
  box-shadow: 0px 8px 16px rgb(247 12 12 / 81%);
  z-index: 1;
}

.dropdown:hover .dropdown-content {
  display: block;
}

.dropdown-content a {
  color: #8b0000;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
}

.dropdown-content a:hover {
  color: #b22222;
}

/* الموبايل */
@media (max-width: 768px) {
  .nav-bar {
    flex-direction: row;
    display: flex;
  }

  .nav-links {
      flex-direction: column;
      gap: 10px;
  }

  .dropbtn {
      font-size: 16px;
  }
}

    <div id="loginSection">

      <!-- يمكنك إضافة المزيد من الشكاوى هنا -->
    </div>
  </div>

  <script>
    function checkPassword() {
      const input = document.getElementById('passwordInput').value;
      const correctPassword = "admin"; // غيّر دي لأي باسورد تحبه
      const error = document.getElementById("errorMessage");
      const complaints = document.getElementById("complaintsSection");
      const login = document.getElementById("loginSection");

      if (input === correctPassword) {
        complaints.style.display = "block";
        login.style.display = "none";
      } else {
        error.style.display = "block";
      }
    }
  </script>
