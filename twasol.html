    body {
        font-family: Arial, sans-serif;
        direction: rtl;

        background-color: #ffeb9c;

        color: white;
    }

    .top-bar {
        background-color: #162037;
        color: #f1c40f;
        padding: 10px;

    }

    .navbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        background: linear-gradient(115deg, #df2912, #6b2121);
        padding: 10px;
    }

    .navbar a {
        color: white;
        padding: 10px 14px;
        text-decoration: none;
        font-size: 16px;
        border-radius: 10px;
        margin: 5px;
    }

    .navbar a:hover {
        background: linear-gradient(268deg, #fffc61, #fff6a5);

    }

    .container {
        max-width: 713px;
        margin: 50px auto;

        color: #f1c40f;
        font-size: 26px;
    }

    p {
        color: #ecf0f1;
        font-size: 17px;
    }

    .contact {
        margin-top: 20px;
    }

    .contact a {
        display: block;
        background: #ffe88a;
        color: #6b2121;
        padding: 14px;
        text-decoration: none;
        margin: 10px auto;
        width: 90%;
        border-radius: 5px;
        font-weight: bold;
        transition: 0.3s;
    }

    .contact a:hover {
        background: #ffb990;
    }

   

    .logo {
        width: 150px;
        margin: 20px auto;
    }

    .bottom-bar {
        background-color: #162037;
        color: #ecf0f1;
        padding: 10px;
        text-align: center;
        position: fixed;
        bottom: 0;
        width: 100%;
    }

    @media (min-width: 768px) {
        .contact a {
            width: 47%;
        }

        input, textarea {
            width: 80%;
        }
    }
</style>
