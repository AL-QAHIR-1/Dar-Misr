      <div class="register-container">
        <form action="register.php" method="post" onsubmit="return validateRegisterForm()">
          <h1>تسجيل حساب جديد</h1>
    
          <div class="form-group">
            <label for="name">الاسم الكامل</label>
            <input type="text" id="name" name="name" required>
          </div>
    
          <div class="form-group">
            <label for="phone">رقم الهاتف</label>
            <input type="tel" id="phone" name="phone" placeholder="01xxxxxxxxx" required>
          </div>
    
          <div class="form-group">
            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-group">
            <label for="role">نوع المستخدم</label>
            <select id="role" name="role" required>
              <option value="">-- اختر --</option>
              <option value="مالك">مالك</option>
              <option value="مستأجر">مستأجر</option>
            </select>
          </div>
          
          <div class="form-group">
            <label  for="building">رقم العمارة</label>
            <input class="form-group-2" type="number" id="building" name="building" min="1" max="36" placeholder="من 1 إلى 36" required>
          </div>
          
          <div class="form-group">
            <labe  l for="apartment">رقم الشقة</label>
            <input class="form-group-2" type="number" id="apartment" name="apartment" min="1" max="24" placeholder="من 1 إلى 24" required>
          </div>

          <div class="form-group">
            <label  for="building">كود الشقة</label>
            <input class="form-group-2" type="number" id="building" name="building"  placeholder=" كود التي تم اخذه من الاتحاد  ان لم تاخده يرجي التواصل مع الاتحاد " required>
          </div>
          
          <div class="form-group">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" name="password" required>
          </div>
    
          <div class="form-group">
            <label for="confirm">تأكيد كلمة المرور</label>
            <input type="password" id="confirm" name="confirm" required>
          </div>
    
          <button type="submit">تسجيل</button>
        </form>

      <script>
        function validateRegisterForm() {
          const phone = document.getElementById("phone").value;
          const password = document.getElementById("password").value;
          const confirm = document.getElementById("confirm").value;
    
          const phonePattern = /^01[0-9]{9}$/;
          if (!phonePattern.test(phone)) {
            alert("يرجى إدخال رقم هاتف صحيح يبدأ بـ 01 ويتكون من 11 رقمًا.");
            return false;
          }
    
          if (password !== confirm) {
            alert("كلمتا المرور غير متطابقتين.");
            return false;
          }
    
          return true;
        }
      </script>
